<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - ANPRG Support">ANPRG Support</title>
    <link rel="stylesheet" th:href="@{bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{site.css}">
    <favicon th:href="@{favicon.ico}" type="image/x-icon">
</head>
<body>
    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ANPRG Support</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/}">Серверы</a>
            </div>
        </div>
    </nav>

    <!-- Сюда подставляется контент каждой страницы -->
    <main class="container mt-4">
        <div layout:fragment="content"></div>
    </main>

    <!-- Футер -->
    <footer class="footer mt-auto py-3 bg-dark">
        <div class="container text-center text-muted">
            <small>ANPRG Support © 2026</small>
        </div>
    </footer>

    <script th:src="@{bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
